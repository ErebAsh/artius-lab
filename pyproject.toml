[project]
name = "artius-lab"
version = "0.1.0"
description = "AI-Powered Resume Builder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "jinja2",
    "weasyprint",
    "groq",
    "openai",
    "python-multipart",
    "python-dotenv",
    "aiosqlite",
    "PyPDF2",
    "bcrypt",
    "PyJWT",
    "cryptography",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".ruff_cache",
    "backend/resume_templates",
    "backend/latex_templates",
    "frontend",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "RUF", # Ruff-specific rules
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PIE", # flake8-pie
    "RET", # flake8-return
]
ignore = [
    "B008",   # FastAPI Depends() / Header() / Query() in argument defaults
    "E501",   # Line length handled by formatter
    "RUF012", # Mutable class default for Pydantic / class attributes
    "B904",   # Within an except clause, raise exceptions with raise ... from
]

[tool.ruff.lint.per-file-ignores]
"test.py" = ["E402"]
"tests/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "tests"]

[tool.pyright]
extraPaths = ["backend", "tests"]

